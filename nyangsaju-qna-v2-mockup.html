<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>냥사주 — Q&A v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700;900&family=Noto+Sans+KR:wght@400;500;700&family=Fraunces:ital,wght@1,400;1,500&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --cream:#F6F1E4; --paper:#FFFCF4; --forest:#2F4A3C; --gold:#C9A227; --rust:#A85C32; --sage:#7C8B6F;
    --ink:#2B2A25; --ink-dim:#6B6455; --line:rgba(43,42,37,0.12);
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--cream); font-family:'Noto Sans KR',sans-serif; color:var(--ink); }
  .page { max-width:460px; margin:0 auto; padding:0 22px 90px; }
  nav { display:flex; align-items:center; justify-content:space-between; padding:26px 0 6px; }
  .back-btn { width:34px; height:34px; border-radius:50%; border:1px solid var(--line); background:var(--paper);
    display:flex; align-items:center; justify-content:center; color:var(--ink-dim); font-size:15px; cursor:pointer; }
  .compose-btn { width:34px; height:34px; border-radius:50%; background:var(--sage); color:#FBF3E8;
    display:flex; align-items:center; justify-content:center; font-size:17px; cursor:pointer; border:none; }
  .head { padding:22px 0 24px; }
  .head .eyebrow { font-family:'Fraunces',serif; font-style:italic; font-size:12px; letter-spacing:2.5px; color:var(--sage); margin:0 0 10px; }
  .head h1 { font-family:'Noto Serif KR',serif; font-size:22px; margin:0 0 6px; color:var(--forest); }
  .head p { font-size:12.5px; color:var(--ink-dim); margin:0; }

  .qcard { background:var(--paper); border:1px solid var(--line); border-radius:16px; padding:18px;
    margin-bottom:12px; cursor:pointer; box-shadow: 0 6px 18px rgba(43,42,37,0.04); }
  .qcard-top { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:8px; }
  .qcard h3 { font-size:14px; margin:0; font-weight:700; line-height:1.5; color:var(--ink); }
  .qcard .snippet { font-size:12px; color:var(--ink-dim); margin:0 0 12px; line-height:1.6;
    overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .qcard .qmeta { display:flex; justify-content:space-between; align-items:center; font-size:11px; color:var(--ink-dim); }
  .status { font-family:'IBM Plex Mono',monospace; font-size:10px; padding:3px 9px; border-radius:999px; flex-shrink:0; white-space:nowrap; }
  .status.waiting { color:var(--ink-dim); background:rgba(43,42,37,0.06); }
  .status.answered { color:var(--sage); background:rgba(124,139,111,0.14); }

  .detail-overlay { display:none; position:fixed; inset:0; background:rgba(43,42,37,0.85); z-index:20; overflow-y:auto; }
  .detail-overlay.open { display:block; }
  .detail-wrap { max-width:460px; margin:0 auto; padding:20px 22px 40px; }
  .detail-close { width:34px; height:34px; border-radius:50%; border:1px solid var(--line); background:var(--paper);
    display:flex; align-items:center; justify-content:center; color:var(--ink-dim); font-size:15px; cursor:pointer; margin-bottom:20px; }
  .detail-wrap h2 { font-family:'Noto Serif KR',serif; font-size:18px; margin:0 0 12px; line-height:1.5; color:var(--forest); }
  .detail-wrap .detail-meta { font-size:11.5px; color:var(--ink-dim); margin-bottom:18px; }
  .detail-wrap p.body { font-size:13.5px; line-height:1.8; margin:0 0 28px; background:var(--paper); padding:16px; border-radius:14px; }

  .answers-label { font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:1.5px; color:var(--ink-dim); margin:0 0 14px; }
  .answer-item { background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:10px; }
  .answer-item .a-who { font-size:11px; color:var(--sage); margin:0 0 6px; font-weight:700; }
  .answer-item p { font-size:13px; line-height:1.7; margin:0; }
  .empty-answers { text-align:center; padding:24px 0; color:var(--ink-dim); font-size:12.5px; }

  .answer-form { margin-top:20px; display:flex; gap:8px; }
  .answer-form input { flex:1; background:var(--paper); border:1px solid var(--line); border-radius:999px; padding:13px 18px; color:var(--ink); font-size:13px; outline:none; }
  .answer-form button { background:var(--sage); color:#FBF3E8; border:none; border-radius:999px; padding:0 20px; font-size:13px; font-weight:700; cursor:pointer; }
</style>
</head>
<body>

<div class="page">
  <nav>
    <div class="back-btn" onclick="location.href='nyangsaju-home-v2-mockup.html'">←</div>
    <div style="font-family:'Noto Serif KR',serif; font-weight:900; font-size:15px; color:var(--forest);">Q&amp;A</div>
    <button class="compose-btn" onclick="location.href='nyangsaju-login-v2-mockup.html'">+</button>
  </nav>
  <div class="head"><p class="eyebrow">CAT WISDOM · ASK ANYTHING</p><h1>궁금한 건 집사들에게</h1><p>고양이 관련 질문을 남기면 다른 집사들이 답해줘요</p></div>
  <div id="qlist"></div>
</div>

<div class="detail-overlay" id="detailOverlay">
  <div class="detail-wrap">
    <div class="detail-close" onclick="closeDetail()">✕</div>
    <h2 id="dTitle"></h2>
    <p class="detail-meta" id="dMeta"></p>
    <p class="body" id="dBody"></p>
    <p class="answers-label" id="aLabel"></p>
    <div id="aList"></div>
    <div class="answer-form">
      <input type="text" placeholder="답변을 남겨보세요" onfocus="this.blur(); location.href='nyangsaju-login-v2-mockup.html'">
      <button onclick="location.href='nyangsaju-login-v2-mockup.html'">등록</button>
    </div>
  </div>
</div>

<script>
const questions = [
  { title:'사료 바꿔도 될까요?', owner:'혜영 집사', snippet:'지금 먹이는 사료를 3년째 먹였는데 요즘 잘 안 먹어서 바꿔볼까 하는데, 급여 시 주의할 점이 있을까요?', status:'answered',
    answers:[{who:'준영 집사', body:'저희도 최근에 바꿨는데, 일주일 정도 기존 사료와 섞어서 서서히 전환하시는 걸 추천드려요!'},
             {who:'수민 집사', body:'급여량은 그대로 두고 비율만 조절하시면 배탈 걱정 없이 넘어갈 수 있어요.'},
             {who:'지훈 집사', body:'혹시 알러지 있는 아이라면 성분표 꼭 확인하세요.'}]},
  { title:'발톱깎이 추천해주세요', owner:'준영 집사', snippet:'초보 집사인데 어떤 발톱깎이가 안전하고 쓰기 편할까요? 겁 많은 고양이라 걱정되네요.', status:'waiting', answers:[] },
  { title:'중성화 시기 고민', owner:'수민 집사', snippet:'6개월 된 남아인데 중성화 시기를 언제로 잡는 게 좋을지 다른 집사님들 경험이 궁금해요.', status:'answered',
    answers:[{who:'유진 집사', body:'저희 동물병원에서는 6개월~1년 사이를 추천하더라고요, 몸무게 보고 결정했어요.'},
             {who:'서연 집사', body:'너무 빠르면 성장에 영향 줄 수 있다고 해서 8개월에 했어요.'}]},
  { title:'화장실을 자꾸 참는 것 같아요', owner:'지훈 집사', snippet:'모래를 자주 안 치웠더니 화장실을 참는 것 같은데, 다른 원인도 있을까요?', status:'waiting', answers:[] },
];
const qlist = document.getElementById('qlist');
questions.forEach(q => {
  const el = document.createElement('div');
  el.className = 'qcard';
  const statusText = q.status === 'waiting' ? '답변대기중' : `답변 ${q.answers.length}`;
  el.innerHTML = `<div class="qcard-top"><h3>${q.title}</h3><span class="status ${q.status}">${statusText}</span></div>
    <p class="snippet">${q.snippet}</p><div class="qmeta"><span>${q.owner}</span></div>`;
  el.addEventListener('click', () => openDetail(q));
  qlist.appendChild(el);
});
function openDetail(q) {
  document.getElementById('dTitle').textContent = q.title;
  document.getElementById('dMeta').textContent = q.owner;
  document.getElementById('dBody').textContent = q.snippet;
  const statusText = q.status === 'waiting' ? '답변대기중' : `답변 ${q.answers.length}개`;
  document.getElementById('aLabel').textContent = statusText.toUpperCase();
  const aList = document.getElementById('aList'); aList.innerHTML = '';
  if (q.answers.length === 0) { aList.innerHTML = '<div class="empty-answers">아직 답변이 없어요. 첫 답변을 남겨보세요!</div>'; }
  else { q.answers.forEach(a => { const item = document.createElement('div'); item.className = 'answer-item';
    item.innerHTML = `<p class="a-who">${a.who}</p><p>${a.body}</p>`; aList.appendChild(item); }); }
  document.getElementById('detailOverlay').classList.add('open');
}
function closeDetail() { document.getElementById('detailOverlay').classList.remove('open'); }
</script>
</body>
</html>
