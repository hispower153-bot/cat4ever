<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>냥사주 — CatStar 글쓰기 v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700;900&family=Noto+Sans+KR:wght@400;500;700&family=Fraunces:ital,wght@1,400;1,500&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --cream:#F6F1E4; --paper:#FFFCF4; --forest:#2F4A3C; --gold:#C9A227; --rust:#A85C32;
    --ink:#2B2A25; --ink-dim:#6B6455; --line:rgba(43,42,37,0.12); --mist:#7C8B6F;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--cream); font-family:'Noto Sans KR',sans-serif; color:var(--ink); }
  .page { max-width:460px; margin:0 auto; padding:0 22px 60px; }
  nav { display:flex; align-items:center; justify-content:space-between; padding:26px 0 6px; }
  .back-btn { width:34px; height:34px; border-radius:50%; border:1px solid var(--line); background:var(--paper);
    display:flex; align-items:center; justify-content:center; color:var(--ink-dim); font-size:15px; cursor:pointer; }
  .post-btn { background:var(--rust); color:#FBF3E8; border:none; border-radius:999px; padding:9px 18px; font-size:13px; font-weight:700; cursor:pointer; }
  .title-row { padding:22px 0 26px; }
  .title-row .eyebrow { font-family:'Fraunces',serif; font-style:italic; font-size:12px; letter-spacing:2.5px; color:var(--rust); margin:0 0 10px; }
  .title-row h1 { font-family:'Noto Serif KR',serif; font-size:21px; margin:0; color:var(--forest); }

  .photo-drop { aspect-ratio:1; border-radius:20px; border:1.5px dashed var(--line); background:var(--paper);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; cursor:pointer; margin-bottom:20px; }
  .photo-drop .icon { font-size:30px; color:var(--ink-dim); }
  .photo-drop p { font-size:12.5px; color:var(--ink-dim); margin:0; }

  .field-label { font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:1.5px; color:var(--ink-dim); text-transform:uppercase; margin:0 0 10px; }
  .cat-select-row { display:flex; gap:8px; margin-bottom:22px; flex-wrap:wrap; }
  .cat-chip { padding:10px 16px; border-radius:999px; border:1px solid var(--line); background:var(--paper); font-size:12.5px; cursor:pointer; color:var(--ink-dim); }
  .cat-chip.selected { background: rgba(168,92,50,0.12); border-color: var(--rust); color:var(--rust); font-weight:700; }

  .input-block { margin-bottom:20px; }
  .input-block input, .input-block textarea { width:100%; background:var(--paper); border:1px solid var(--line);
    border-radius:14px; padding:14px 16px; color:var(--ink); font-size:13.5px; font-family:'Noto Sans KR',sans-serif; outline:none; }
  .input-block textarea { min-height:120px; resize:vertical; line-height:1.7; }
  .input-block input::placeholder, .input-block textarea::placeholder { color:var(--ink-dim); }

  .submit-btn { width:100%; background:var(--rust); color:#FBF3E8; border:none; border-radius:999px; padding:16px; font-size:14px; font-weight:700; cursor:pointer; margin-top:8px; }

  .toast { position:fixed; left:50%; bottom:32px; transform:translateX(-50%) translateY(20px);
    background:var(--forest); color:var(--cream); padding:12px 20px; border-radius:999px; font-size:12.5px;
    opacity:0; pointer-events:none; transition:opacity .25s ease, transform .25s ease; z-index:50; white-space:nowrap; }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="page">
  <nav>
    <div class="back-btn" onclick="location.href='nyangsaju-catstar-v2-mockup.html'">←</div>
    <button class="post-btn" onclick="showToast('나비의 오늘이 등록됐어요 🐾')">게시하기</button>
  </nav>
  <div class="title-row"><p class="eyebrow">NEW POST</p><h1>오늘 우리 냥이는 어땠나요?</h1></div>
  <div class="photo-drop" onclick="showToast('사진 선택창이 열려요')"><span class="icon">📷</span><p>탭해서 사진 올리기</p></div>
  <p class="field-label">어떤 냥이인가요</p>
  <div class="cat-select-row"><div class="cat-chip selected">나비</div><div class="cat-chip">+ 새 냥이 등록</div></div>
  <div class="input-block"><p class="field-label" style="margin-bottom:8px;">제목</p><input type="text" placeholder="예: 창가 명상 중"></div>
  <div class="input-block"><p class="field-label" style="margin-bottom:8px;">내용</p><textarea placeholder="오늘 나비에게 있었던 이야기를 들려주세요"></textarea></div>
  <button class="submit-btn" onclick="showToast('나비의 오늘이 등록됐어요 🐾')">게시하기</button>
</div>

<div class="toast" id="toast"></div>
<script>
document.querySelectorAll('.cat-chip').forEach(c => c.addEventListener('click', function() {
  if (this.textContent.includes('새 냥이')) { showToast('냥이 등록 화면은 곧 만나요 ✦'); return; }
  document.querySelectorAll('.cat-chip').forEach(x => x.classList.remove('selected'));
  this.classList.add('selected');
}));
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}
</script>
</body>
</html>
