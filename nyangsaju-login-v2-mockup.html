<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>냥사주 — 로그인 v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700;900&family=Noto+Sans+KR:wght@400;500;700&family=Fraunces:ital,wght@1,400;1,500&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --cream:#F6F1E4; --paper:#FFFCF4; --forest:#2F4A3C; --forest-deep:#1F3129;
    --sage:#7C8B6F; --gold:#C9A227; --gold-soft:#E0C169; --rust:#A85C32;
    --ink:#2B2A25; --ink-dim:#6B6455; --line:rgba(43,42,37,0.12);
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--cream); font-family:'Noto Sans KR',sans-serif; color:var(--ink); min-height:100vh; }
  .split { display:flex; min-height:100vh; }
  .visual {
    flex: 1; display:none;
    background: linear-gradient(180deg, rgba(31,49,41,0.2) 0%, rgba(20,26,20,0.65) 100%),
      url('https://images.unsplash.com/photo-1495360010541-f48722b34f7d?w=900&q=80') center/cover;
    position: relative;
  }
  .visual .quote { position:absolute; bottom:50px; left:50px; right:50px; color:#FBF7EC; }
  .visual .quote p.eyebrow { font-family:'Fraunces',serif; font-style:italic; font-size:12px; letter-spacing:2.5px; color:var(--gold-soft); margin:0 0 12px; }
  .visual .quote h2 { font-family:'Noto Serif KR',serif; font-size:24px; line-height:1.5; margin:0; }
  @media (min-width: 760px) { .visual { display:block; } }

  .form-side { flex: 1; max-width: 420px; margin: 0 auto; padding: 0 28px 60px; display:flex; flex-direction:column; width:100%; }
  nav { display:flex; align-items:center; padding:28px 0 0; }
  .back-btn { width:36px; height:36px; border-radius:50%; border:1px solid var(--line); background:var(--paper);
    display:flex; align-items:center; justify-content:center; color:var(--ink-dim); font-size:15px; cursor:pointer; }

  .brand { text-align:center; padding:50px 0 8px; }
  .brand .seal { width:52px; height:52px; margin:0 auto 20px; border-radius:50%; border:1.5px solid var(--rust);
    display:flex; align-items:center; justify-content:center; font-family:'Noto Serif KR',serif; font-weight:900; font-size:20px; color:var(--rust); }
  .brand h1 { font-family:'Noto Serif KR',serif; font-size:22px; margin:0 0 10px; color:var(--forest); }
  .brand p { font-size:13px; color:var(--ink-dim); margin:0 0 40px; line-height:1.6; }

  .oauth-list { display:flex; flex-direction:column; gap:12px; }
  .oauth-btn { display:flex; align-items:center; justify-content:center; gap:10px; background:var(--paper);
    border:1px solid var(--line); border-radius:999px; padding:15px; font-size:14px; font-weight:700; color:var(--ink); cursor:pointer; }
  .oauth-btn.google { background: var(--forest); color:#FBF7EC; border:none; }
  .oauth-btn .icon { font-size:16px; width:20px; text-align:center; }
  .oauth-btn.disabled { opacity:0.45; }

  .divider { display:flex; align-items:center; gap:12px; margin:28px 0; color:var(--ink-dim); font-size:11.5px; }
  .divider::before, .divider::after { content:''; flex:1; height:1px; background:var(--line); }

  .email-form { display:flex; flex-direction:column; gap:10px; }
  .email-form input { background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:14px 16px;
    color:var(--ink); font-size:13.5px; font-family:'Noto Sans KR',sans-serif; outline:none; }
  .email-form input::placeholder { color:var(--ink-dim); }
  .email-form button { background:var(--rust); color:#FBF3E8; border:none; border-radius:999px; padding:15px;
    font-size:14px; font-weight:700; cursor:pointer; margin-top:4px; }

  .footer-note { text-align:center; font-size:11.5px; color:var(--ink-dim); margin-top:auto; padding-top:40px; line-height:1.7; }
  .footer-note a { color: var(--forest); text-decoration:none; }

  .toast { position:fixed; left:50%; bottom:32px; transform:translateX(-50%) translateY(20px);
    background:var(--forest); color:var(--cream); padding:12px 20px; border-radius:999px; font-size:12.5px;
    opacity:0; pointer-events:none; transition:opacity .25s ease, transform .25s ease; z-index:50; white-space:nowrap; }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="split">
  <div class="visual">
    <div class="quote">
      <p class="eyebrow">CAT4EVER</p>
      <h2>매일 아침, 우리 냥이의<br>오늘을 가장 먼저 만나보세요</h2>
    </div>
  </div>

  <div class="form-side">
    <nav><div class="back-btn" onclick="history.back()">←</div></nav>

    <div class="brand">
      <div class="seal">냥</div>
      <h1>돌아왔네요, 집사님</h1>
      <p>로그인하고 CatStar에 우리 냥이의<br>오늘을 남겨보세요</p>
    </div>

    <div class="oauth-list">
      <button class="oauth-btn google" onclick="showToast('Google 로그인으로 이동해요')"><span class="icon">G</span> Google로 계속하기</button>
      <button class="oauth-btn disabled" onclick="showToast('Apple 로그인은 준비 중이에요')"><span class="icon">🍎</span> Apple로 계속하기</button>
      <button class="oauth-btn disabled" onclick="showToast('Microsoft 로그인은 준비 중이에요')"><span class="icon">⊞</span> Microsoft로 계속하기</button>
    </div>

    <div class="divider">또는</div>

    <div class="email-form">
      <input type="email" placeholder="이메일 주소">
      <input type="password" placeholder="비밀번호">
      <button onclick="showToast('이메일 로그인은 곧 만나요 ✦')">이메일로 계속하기</button>
    </div>

    <p class="footer-note">계속 진행하면 냥사주의<br><a href="#">이용약관</a> 및 <a href="#">개인정보처리방침</a>에 동의하게 돼요</p>
  </div>
</div>

<div class="toast" id="toast"></div>
<script>
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}
</script>
</body>
</html>
