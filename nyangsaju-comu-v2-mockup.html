<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>냥사주 — Comu v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700;900&family=Noto+Sans+KR:wght@400;500;700&family=Fraunces:ital,wght@1,400;1,500&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --cream:#F6F1E4; --paper:#FFFCF4; --forest:#2F4A3C; --gold:#C9A227; --rust:#A85C32; --sage:#7C8B6F;
    --ink:#2B2A25; --ink-dim:#6B6455; --line:rgba(43,42,37,0.12);
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--cream); font-family:'Noto Sans KR',sans-serif; color:var(--ink); }
  .page { max-width:460px; margin:0 auto; padding:0 22px 90px; }
  nav { display:flex; align-items:center; justify-content:space-between; padding:26px 0 6px; }
  .back-btn { width:34px; height:34px; border-radius:50%; border:1px solid var(--line); background:var(--paper);
    display:flex; align-items:center; justify-content:center; color:var(--ink-dim); font-size:15px; cursor:pointer; }
  .compose-btn { width:34px; height:34px; border-radius:50%; background:var(--forest); color:var(--cream);
    display:flex; align-items:center; justify-content:center; font-size:17px; cursor:pointer; border:none; }
  .head { padding:22px 0 24px; }
  .head .eyebrow { font-family:'Fraunces',serif; font-style:italic; font-size:12px; letter-spacing:2.5px; color:var(--forest); margin:0 0 10px; }
  .head h1 { font-family:'Noto Serif KR',serif; font-size:22px; margin:0 0 6px; color:var(--forest); }
  .head p { font-size:12.5px; color:var(--ink-dim); margin:0; }

  .pcard { background:var(--paper); border:1px solid var(--line); border-radius:16px; padding:18px;
    margin-bottom:12px; cursor:pointer; display:flex; gap:14px; align-items:center; box-shadow: 0 6px 18px rgba(43,42,37,0.04); }
  .pcard .avatar { width:38px; height:38px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:16px; }
  .pcard .body { flex:1; min-width:0; }
  .pcard h3 { font-size:13.5px; margin:0 0 5px; font-weight:700; color:var(--ink); }
  .pcard .snippet { font-size:12px; color:var(--ink-dim); margin:0 0 8px; line-height:1.5; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pcard .pmeta { font-size:10.5px; color:var(--ink-dim); display:flex; gap:10px; }

  .detail-overlay { display:none; position:fixed; inset:0; background:rgba(43,42,37,0.85); z-index:20; overflow-y:auto; }
  .detail-overlay.open { display:block; }
  .detail-wrap { max-width:460px; margin:0 auto; padding:20px 22px 40px; }
  .detail-close { width:34px; height:34px; border-radius:50%; border:1px solid var(--line); background:var(--paper);
    display:flex; align-items:center; justify-content:center; color:var(--ink-dim); font-size:15px; cursor:pointer; margin-bottom:20px; }
  .detail-owner { display:flex; align-items:center; gap:10px; margin-bottom:16px; }
  .detail-owner .avatar { width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:16px; }
  .detail-owner .who { font-size:12.5px; font-weight:700; color:var(--ink); }
  .detail-owner .time { font-size:10.5px; color:var(--ink-dim); display:block; font-weight:400; }
  .detail-wrap h2 { font-family:'Noto Serif KR',serif; font-size:18px; margin:0 0 12px; line-height:1.5; color:var(--forest); }
  .detail-wrap p.body { font-size:13.5px; line-height:1.8; margin:0 0 28px; background:var(--paper); padding:16px; border-radius:14px; }

  .comments-label { font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:1.5px; color:var(--ink-dim); margin:0 0 14px; }
  .comment-item { display:flex; gap:10px; margin-bottom:14px; }
  .comment-item .c-avatar { width:28px; height:28px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:12px; background: var(--paper); }
  .comment-item .c-body { font-size:12.5px; }
  .comment-item .c-who { font-weight:700; margin-bottom:3px; color: var(--forest); }
  .comment-item p { margin:0; line-height:1.6; color:var(--ink); }

  .comment-form { margin-top:20px; display:flex; gap:8px; }
  .comment-form input { flex:1; background:var(--paper); border:1px solid var(--line); border-radius:999px; padding:13px 18px; color:var(--ink); font-size:13px; outline:none; }
  .comment-form button { background:var(--forest); color:var(--cream); border:none; border-radius:999px; padding:0 20px; font-size:13px; font-weight:700; cursor:pointer; }
</style>
</head>
<body>

<div class="page">
  <nav>
    <div class="back-btn" onclick="location.href='nyangsaju-home-v2-mockup.html'">←</div>
    <div style="font-family:'Noto Serif KR',serif; font-weight:900; font-size:15px; color:var(--forest);">Comu</div>
    <button class="compose-btn" onclick="location.href='nyangsaju-login-v2-mockup.html'">+</button>
  </nav>
  <div class="head"><p class="eyebrow">CAT LOVERS · FREE TALK</p><h1>집사들의 이야기 공간</h1><p>가벼운 일상부터 고민까지, 자유롭게 나눠요</p></div>
  <div id="plist"></div>
</div>

<div class="detail-overlay" id="detailOverlay">
  <div class="detail-wrap">
    <div class="detail-close" onclick="closeDetail()">✕</div>
    <div class="detail-owner">
      <div class="avatar" id="dAvatar" style="background:rgba(47,74,60,0.14); color:var(--forest);">🐾</div>
      <div><div class="who" id="dWho"></div><span class="time" id="dTime"></span></div>
    </div>
    <h2 id="dTitle"></h2>
    <p class="body" id="dBody"></p>
    <p class="comments-label" id="cLabel"></p>
    <div id="cList"></div>
    <div class="comment-form">
      <input type="text" placeholder="댓글을 남겨보세요" onfocus="this.blur(); location.href='nyangsaju-login-v2-mockup.html'">
      <button onclick="location.href='nyangsaju-login-v2-mockup.html'">등록</button>
    </div>
  </div>
</div>

<script>
const posts = [
  { emoji:'🐈', bg:'rgba(201,162,39,0.18)', color:'#C9A227', owner:'서연 집사', time:'12분 전', title:'오늘 첫눈 온 거 보고 완전 얼음 된 우리 루비', snippet:'창밖 눈 보고 그대로 굳어버렸어요 ㅋㅋㅋ 다들 첫눈 반응 어땠나요',
    comments:[{who:'유진 집사', body:'저희 치즈는 창문에 코 박고 안 떨어져요 ㅎㅎ'},{who:'준영 집사', body:'귀여워요 진짜 ㅠㅠ'}] },
  { emoji:'😺', bg:'rgba(168,92,50,0.16)', color:'#A85C32', owner:'지훈 집사', time:'40분 전', title:'혹시 캣타워 추천해주실 분', snippet:'모카가 요즘 부쩍 높은 곳을 좋아해서 튼튼한 캣타워를 찾고 있어요',
    comments:[{who:'수민 집사', body:'저희 집은 원목 캣타워 쓰는데 만족도 높아요!'}] },
  { emoji:'🐾', bg:'rgba(47,74,60,0.14)', color:'#2F4A3C', owner:'혜영 집사', time:'1시간 전', title:'퇴근하고 집 오면 현관까지 마중나오는 나비', snippet:'매일 이 순간 때문에 하루 버텨요 ㅎㅎ 다들 그런 순간 있으신가요',
    comments:[] },
  { emoji:'😻', bg:'rgba(124,139,111,0.18)', color:'#7C8B6F', owner:'유진 집사', time:'2시간 전', title:'다묘가정 처음인데 팁 있을까요', snippet:'둘째 들인 지 일주일 됐는데 아직 서로 경계해요. 시간이 해결해줄까요?',
    comments:[{who:'서연 집사', body:'저희도 한 달 정도 걸렸어요, 조급해하지 마세요!'},{who:'지훈 집사', body:'각자 공간 나눠주는 게 도움됐어요'}] },
];
const plist = document.getElementById('plist');
posts.forEach(p => {
  const el = document.createElement('div');
  el.className = 'pcard';
  el.innerHTML = `<div class="avatar" style="background:${p.bg}; color:${p.color};">${p.emoji}</div>
    <div class="body"><h3>${p.title}</h3><p class="snippet">${p.snippet}</p>
    <div class="pmeta"><span>${p.owner}</span><span>${p.time}</span><span>💬 ${p.comments.length}</span></div></div>`;
  el.addEventListener('click', () => openDetail(p));
  plist.appendChild(el);
});
function openDetail(p) {
  document.getElementById('dAvatar').textContent = p.emoji;
  document.getElementById('dAvatar').style.background = p.bg;
  document.getElementById('dAvatar').style.color = p.color;
  document.getElementById('dWho').textContent = p.owner;
  document.getElementById('dTime').textContent = p.time;
  document.getElementById('dTitle').textContent = p.title;
  document.getElementById('dBody').textContent = p.snippet;
  document.getElementById('cLabel').textContent = `댓글 ${p.comments.length}개`;
  const cList = document.getElementById('cList'); cList.innerHTML = '';
  if (p.comments.length === 0) { cList.innerHTML = '<p style="font-size:12.5px; color:var(--ink-dim);">아직 댓글이 없어요. 첫 댓글을 남겨보세요!</p>'; }
  else { p.comments.forEach(c => { const item = document.createElement('div'); item.className = 'comment-item';
    item.innerHTML = `<div class="c-avatar">🐾</div><div class="c-body"><div class="c-who">${c.who}</div><p>${c.body}</p></div>`;
    cList.appendChild(item); }); }
  document.getElementById('detailOverlay').classList.add('open');
}
function closeDetail() { document.getElementById('detailOverlay').classList.remove('open'); }
</script>
</body>
</html>
